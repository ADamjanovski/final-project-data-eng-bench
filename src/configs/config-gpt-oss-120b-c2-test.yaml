model:
  id: openai.gpt-oss-120b-1:0
  bedrock_region: us-east-1
  context_window_limit: 131072
  temperature: 0.2
  reasoning_effort: medium
  max_tokens: 16384
  read_timeout: 600
  request_attempts: 3

run:
  session_prefix: c2-retrieval-text-gpt-oss-120b
  max_invalid_tool_calls: 10
  max_token_continuations: 5
  max_text_tool_continuations: 10
  output_file: runs/c2-retrieval-text-gpt-oss-120b-medium-2.jsonl
  transcript_file: transcripts/c2-retrieval-text-gpt-oss-120b-medium-2.txt

rag:
  embedding_model: amazon.titan-embed-text-v2:0
  dimension: 1024
  bucket: training-free-grpo
  index: rag-training-gpt-oss-120b-dc79e41a
  top_k: 10
